name: provision-ghcr
on: workflow_dispatch
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push tiny image to force package creation
        run: |
          docker pull hello-world
          docker tag hello-world ghcr.io/gitoutmymyway/xekrung-apex-vllm:provision
          docker push ghcr.io/gitoutmymyway/xekrung-apex-vllm:provision